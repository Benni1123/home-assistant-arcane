name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - ".github/workflows/release.yml"
      - "scripts/release.py"
      - "hacs.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcane-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Always release the latest main, not a stale queued push. Validate that
      # exact checkout below before committing, tagging or publishing anything.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py
